paths:
  /market:
    get:
      tags:
        - Market
      summary: 마켓 판매 목록 조회
      description: 마켓에 등록된 모든 판매 아이템을 필터링하여 조회합니다.
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
          description: 카드 이름 검색
        - in: query
          name: grade
          schema: { type: string }
        - in: query
          name: genre
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        200:
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleItem'
                  nextCursor:
                    type: string

  /market/{saleId}:
    get:
      tags:
        - Market
      summary: 판매글 상세 조회
      parameters:
        - in: path
          name: saleId
          required: true
          schema: { type: string }
      responses:
        200:
          description: 상세 정보 반환
