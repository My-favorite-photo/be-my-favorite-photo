paths:
  /events/rewards/grant:
    post:
      tags:
        - Events
      summary: 유저에게 이벤트 보상(포인트) 지급
      description: |
        특정 유저에게 정해진 양의 포인트를 지급합니다. 
        이 API는 내부적으로 포인트 잔액을 업데이트하고 포인트 히스토리에 기록을 남깁니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, type]
              properties:
                userId:
                  type: string
                  description: 보상을 받을 유저의 ID (UUID)
                  example: 'user-uuid-1234'
                amount:
                  type: integer
                  description: 지급할 포인트 금액 (0보다 커야 함)
                  example: 1000
                type:
                  type: string
                  description: 포인트 지급 유형 (예 EVENT_REWARD, ATTENDANCE_CHECK 등)
                  example: 'EVENT_REWARD'
                description:
                  type: string
                  description: 보상에 대한 상세 설명 (미입력 시 '이벤트 보상 지급'으로 저장)
                  example: '신규 가입 환영 이벤트 보상'
      responses:
        201:
          description: 보상 지급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  amount:
                    type: integer
                  type:
                    type: string
                  description:
                    type: string
        400:
          description: 필수 항목 누락 또는 유효하지 않은 포인트 양 (0 이하)
        404:
          description: 존재하지 않는 유저
