paths:
  /notifications:
    get:
      tags:
        - Notifications
      summary: 내 알림 목록 조회
      description: |
        현재 로그인한 유저에게 온 최신 알림 목록을 가져옵니다. 
        기본적으로 5개의 최신 알림을 반환하며, limit 파라미터로 개수를 조절할 수 있습니다.
        호환, 구매등의 알림을 담당합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
          description: 가져올 알림의 개수
      responses:
        200:
          description: 알림 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        401:
          description: 인증 실패

  /notifications/read/{id}:
    post:
      tags:
        - Notifications
      summary: 알림 읽음 처리
      description: 특정 알림의 상태를 '읽음'으로 변경합니다.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: 읽음 처리할 알림의 UUID
      responses:
        200:
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        404:
          description: 해당 알림을 찾을 수 없음
