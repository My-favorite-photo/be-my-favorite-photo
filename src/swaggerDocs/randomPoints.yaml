paths:
  /points/random/eligibility:
    get:
      tags:
        - RandomPoints
      summary: 랜덤 포인트 참여 가능 여부 확인
      description: |
        현재 사용자가 랜덤 포인트 이벤트에 참여할 수 있는지 확인합니다.
        마지막 참여 시점으로부터 1분이 경과해야 다시 참여할 수 있습니다.
        1분은 시연용으로 프로덕션시 1시간으로 변경시켜야 합니다.
      security:
        - bearerAuth: []
      responses:
        200:
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  canTry:
                    type: boolean
                    description: 참여 가능 여부
                    example: false
                  nextAvailableAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: 참여 불가능할 경우, 다음 참여 가능 시간
                    example: '2023-10-27T10:00:00.000Z'

  /points/random:
    post:
      tags:
        - RandomPoints
      summary: 랜덤 포인트 뽑기 실행
      description: |
        랜덤 포인트를 획득합니다 (보상 범위: 0, 1, 2, 5 포인트). 
        실행 시 유저의 포인트 잔액이 업데이트되고 포인트 내역에 기록됩니다.
      security:
        - bearerAuth: []
      responses:
        201:
          description: 뽑기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  reward:
                    type: integer
                    description: 획득한 포인트 양
                    example: 5
                  nextAvailableAt:
                    type: string
                    format: date-time
                    description: 다음 참여 가능 시간
                    example: '2023-10-27T10:01:00.000Z'
        400:
          description: 쿨타임 미종료 (Cooldown not finished)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Cooldown not finished'
                  nextAvailableAt:
                    type: string
                    format: date-time
