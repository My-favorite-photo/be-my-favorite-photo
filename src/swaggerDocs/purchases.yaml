paths:
  /purchases/{saleId}:
    post:
      tags:
        - Purchases
      summary: 구매 내역 생성
      description: |
        마켓에서 상품을 구매한 후, 그 결과에 대한 히스토리를 DB에 기록합니다.
        실제 포인트 차감이나 카드 이동은 마켓 서비스에서 처리되고, 이 라우터는 기록(Logging)을 담당합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [saleId, quantity, totalPrice]
              properties:
                saleId:
                  type: string
                  description: 구매한 마켓 판매글의 ID
                  example: 'uuid-sale-1234'
                quantity:
                  type: integer
                  description: 구매 수량
                  example: 1
                totalPrice:
                  type: number
                  description: 총 결제 금액
                  example: 50000
      responses:
        201:
          description: 구매 내역 저장 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: '구매 내역이 성공적으로 기록되었습니다.'
                  purchase:
                    $ref: '#/components/schemas/Purchase'
        400:
          description: 필수 항목 누락 또는 잘못된 요청
        401:
          description: 인증 실패
