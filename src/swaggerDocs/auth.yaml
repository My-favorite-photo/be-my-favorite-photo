paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 회원가입
      description: 새로운 사용자를 등록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - nickname
              properties:
                email:
                  type: string
                  example: 'user@example.com'
                password:
                  type: string
                  example: 'password123'
                nickname:
                  type: string
                  example: '최애포토'
      responses:
        201:
          description: 회원가입 성공
        400:
          description: 입력값 누락 또는 유효성 실패

  /auth/login:
    post:
      tags:
        - Auth
      summary: 로그인
      description: 이메일과 비밀번호로 로그인하고 토큰을 발급받습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: 'user@example.com'
                password:
                  type: string
                  example: 'password123'
      responses:
        200:
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        400:
          description: 이메일 또는 비밀번호 누락

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: 토큰 재발급
      description: Refresh Token을 사용하여 새로운 Access Token을 발급받습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: 재발급 성공
        401:
          description: 리프레시 토큰이 유효하지 않음

  /auth/me:
    get:
      tags:
        - Auth
      summary: 내 정보 조회
      description: 현재 로그인된 유저의 정보를 가져옵니다.
      security:
        - bearerAuth: []
      responses:
        200:
          description: 조회 성공
        401:
          description: 인증 실패 (Access Token 만료 또는 누락)

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하고 로그아웃합니다.
      security:
        - bearerAuth: []
      responses:
        200:
          description: 로그아웃 성공
